# Applies to the root workspace and all three standalone Cargo manifests.
[advisories]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0",
  "Zlib", "CDLA-Permissive-2.0", "OpenSSL", "CC0-1.0",
]

# Only unpublished first-party workspace crates; third-party licensing is checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
