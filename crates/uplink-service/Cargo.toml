[package]
name = "uplink-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
filedescriptor = "0.8.3"
getrandom = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
nix = { version = "0.29", default-features = false, features = ["fs"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
subtle = "2"
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
uplink-ingest = { path = "../uplink-ingest" }
uplink-infisical-transport = { path = "../uplink-infisical-transport" }
uplink-media = { path = "../uplink-media" }
uplink-chat = { path = "../uplink-chat" }
uplink-core.workspace = true
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
toml = { workspace = true, features = ["display"] }
futures = "0.3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.49", features = ["process"] }
memfd = "0.6"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
