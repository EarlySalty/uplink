[package]
name = "uplink-vod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
uplink-ingest = { path = "../uplink-ingest" }
uplink-media = { path = "../uplink-media" }
zeroize = "1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[lints]
workspace = true
