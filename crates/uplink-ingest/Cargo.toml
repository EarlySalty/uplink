[package]
name = "uplink-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.11"
getrandom = "0.4"
scuffle-rtmp = { path = "../../third_party/scuffle-rtmp" }
tokio = { version = "1.49", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
serde = { workspace = true }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.49", features = ["process"] }

[lints]
workspace = true
