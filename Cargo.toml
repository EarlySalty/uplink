[workspace]
members = ["crates/uplink-core", "crates/uplink-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde", "std"] }
uplink-core = { path = "crates/uplink-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

