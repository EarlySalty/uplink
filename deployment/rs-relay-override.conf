# Vorlage für den geprüften Wechsel derselben bestehenden User-Unit.
# LoadCredential bleibt im vorhandenen Unitvertrag erhalten.
[Service]
ExecStart=
ExecStart=/opt/uplink/current/start-uplink.sh
WorkingDirectory=/opt/uplink/current
Environment=
EnvironmentFile=
NoNewPrivileges=true
UMask=0077
Restart=on-failure
RestartSec=5
TimeoutStopSec=30
