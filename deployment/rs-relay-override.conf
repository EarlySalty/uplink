# Vorlage für den geprüften Wechsel derselben bestehenden User-Unit.
# LoadCredential bleibt im vorhandenen Unitvertrag erhalten.
[Service]
ExecStart=
ExecStart=/opt/uplink/current/start-uplink.sh
WorkingDirectory=/opt/uplink/current
Environment=
EnvironmentFile=
NoNewPrivileges=true
# systemd 255 bildet in der impliziten Usernamespace einer User-Unit nur den
# Dienstnutzer ab. Host-root würde als 65534 erscheinen und die unveränderte
# Infisical-Socketprüfung ablehnen. Die drei geerbten Namespace-Regeln deshalb
# ausdrücklich zurücksetzen; PrivateUsers=no allein genügt nicht.
# Damit entfallen der Mount-Schreibschutz und das private /tmp. Host-Dateirechte,
# rootkontrollierter Socketpfad, ACL und NoNewPrivileges bleiben wirksam.
PrivateUsers=no
PrivateTmp=no
ProtectSystem=no
ProtectProc=default
UMask=0077
Restart=on-failure
RestartSec=5
TimeoutStopSec=240
