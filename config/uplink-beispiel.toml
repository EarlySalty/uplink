# Technische Vorlage, keine installierte öffentliche Adresse.
# Bindung, DNS und Firewall vor dem regulären Wechsel gemeinsam prüfen.
api_bind = "127.0.0.1:8892"
ingest_bind = "127.0.0.1:1935"
public_ingest_url = "rtmps://ingest.example.invalid:1935/live"
dock_base_url = "https://deutsche-deadlock-community.de/uplink"
max_sessions = 4
max_pending_connections = 8
max_sessions_per_tenant = 1
database_max_queries = 4
request_timeout_seconds = 10

[infisical]
base_url = "http://infisical.local"
socket_path = "/run/uplink-infisical/api.sock"
socket_owner_uid = 0
project_id = "PROJEKT-ID-EINTRAGEN"
environment = "prod"
secret_path = "/"
# Vom vorhandenen autorisierten Startprozess geöffneter FD; keine neue Datei.
credential_fd = 5

[chat]
bot_base_url = "http://127.0.0.1:8769"
allowed_origins = ["https://deutsche-deadlock-community.de"]
max_users = 128
max_sockets_per_user = 8
idle_timeout_seconds = 120

[tls]
# Nur Namen; Bereitstellung und Erneuerung müssen vor Start eingerichtet sein.
source = "infisical"
certificate_secret = "UPLINK_TLS_CERTIFICATE"
private_key_secret = "UPLINK_TLS_PRIVATE_KEY"

[media]
ffmpeg = "/opt/uplink/media/ffmpeg8-c733b4b2/ffmpeg"
ffprobe = "/opt/uplink/media/ffmpeg8-c733b4b2/ffprobe"
work_directory = "/run/user/1000/uplink-media"
max_event_bytes = 2097152
max_queued_bytes = 16777216
max_queued_events = 512
max_tracks = 8
# Explizite Quellzuordnung, keine aus dem Codec erratene Audio-Rolle.
live_audio_track = 0
vod_audio_track = 1

[[platforms]]
name = "twitch"
allowed_hosts = ["live.twitch.tv", "ingest.global-contribute.live-video.net"]
allow_unencrypted = false
video_codec = "h264"
use_vod_audio = true

[[platforms]]
name = "kick"
allowed_hosts = ["live-video.net"]
allow_unencrypted = false
video_codec = "h264"
use_vod_audio = false

[[platforms]]
name = "youtube"
allowed_hosts = ["a.rtmps.youtube.com", "b.rtmps.youtube.com"]
allow_unencrypted = false
video_codec = "h264"
use_vod_audio = false

[[platforms]]
name = "tiktok"
allowed_hosts = ["tiktok.com"]
allow_unencrypted = false
video_codec = "h264"
use_vod_audio = false
